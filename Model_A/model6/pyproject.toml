[project]
name = "guardplan"
version = "0.3.1"
description = "M6: Privacy-Typed, Constraint-Grounded Hierarchical RAG Planner"
requires-python = ">=3.11"
dependencies = ["pypdf==7.0.1", "pypdfium2==5.15.2", "Pillow>=10"]

[project.scripts]
guardplan = "guardplan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardplan"]
