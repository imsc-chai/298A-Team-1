# Locked reproduction target. Do not change after a scored run starts.
# Course: DATA 298A Section 21 Topic 17 — reproduced baseline (not one of the four models).

paper:
  title: "OpenJarvis: Personal AI, On Personal Devices"
  authors: "Saad-Falcon et al."
  year: 2026
  arxiv: "2605.17172"
  url: "https://arxiv.org/abs/2605.17172"
  code: "https://github.com/open-jarvis/OpenJarvis"

claim:
  table: 1
  framework_row: "Hermes Agent"
  condition: "(c) OPENJARVIS (with Qwen3.5-9B)"
  what_this_is_not: "Hermes Agent itself. Hermes + Qwen3.5-9B is 68.7% (condition b)."
  benchmark: PinchBench
  n_tasks: 23
  metric: accuracy_percent
  published_mean: 87.9
  published_n_runs: 5
  related_gaia_percent: 40.8   # same table cell; not the 298A headline number
  hermes_qwen_drop_percent: 68.7
  hermes_cloud_percent: 93.5   # Claude Opus 4.6, condition (a)

protocol_from_paper:
  runs: 5
  report: mean_and_stddev
  agentic_timeout_seconds: 7200
  judge: "GPT-5-mini unless the task is deterministically graded"
  intelligence_fixed: "Qwen3.5-9B"
  optimized_fields: ["Engine", "Agent", "Tools & Memory"]

our_run_config:
  model: "qwen3.5:9b"
  engine: ollama
  agent: native_react
  seeds: [42, 43, 44, 45, 46]
  max_samples: null          # null = all 23 PinchBench tasks
  smoke_max_samples: 2
  smoke_seeds: [42]

comparison_rule:
  published_row_label: "Saad-Falcon et al. 2026 Table 1 (c) reproduced target"
  we_report_separately:
    - published_87_9
    - our_mean_plus_stddev
    - gap_pp
  gap_is_a_finding: true
